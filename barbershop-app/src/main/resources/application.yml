server:
  port: ${PORT:8080}
  shutdown: graceful            # stop accepting, let in-flight requests finish
  tomcat:
    connection-timeout: 5s      # time to receive the request line and headers
    keep-alive-timeout: 60s
    threads:
      max: 200
spring:
  application:
    name: barbershop-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  autoconfigure:
    # The pool is built in BarbershopConfiguration (the composition root), not by auto-configuration.
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  jackson:
    # Optional fields absent from the contract's responses are sent as null, never dropped silently.
    default-property-inclusion: always
logging:
  structured:
    format:
      console: ecs              # one JSON object per line; the MDC adds correlationId
barbershop:
  database:
    # Empty: in-memory repositories. The schema lives in barber-saas-barbershop-db; this service never migrates it.
    url: ${DATABASE_URL:}
    user: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    pool-max: ${DB_POOL_MAX:10}
    statement-timeout-ms: ${DB_STATEMENT_TIMEOUT_MS:5000}
  # identity-auth's internal user read for a new barber profile (ADR-014). Empty: creating a profile answers 503.
  identity-auth-api-url: ${IDENTITY_AUTH_API_URL:}
  # This service's own token (sub: barber-saas-barbershop-api), never a user's.
  service-token: ${SERVICE_TOKEN:}
